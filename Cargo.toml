# rb-sys resolves crate metadata from the gem root, so the extension lives in a
# workspace rather than standing alone under ext/.
[workspace]
members = ["ext/andromeda_cms"]
resolver = "2"

# Profiles only take effect at the workspace root; in the member crate Cargo
# ignored them, which left Windows builds unstripped at four times the size.
[profile.release]
opt-level = 3
strip = true
lto = true
