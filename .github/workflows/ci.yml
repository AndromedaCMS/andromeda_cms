name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        rails: ["8.0", "8.1"]
        include:
          # The extension links against the host Ruby, so at least one macOS
          # run guards the platform most contributors develop on.
          - os: macos-latest
            ruby: "4.0"
            rails: "8.1"
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      # Ruby 3.2 on ubuntu-26.04 is built with GCC 15, whose default is C23,
      # so its configure leaves HAVE_STDBOOL_H undefined (C23's <stdbool.h>
      # does not define `bool`). bindgen parses the headers as C17 and then
      # has no `bool`. Including <stdbool.h> first defines it in either
      # mode; macOS uses its own target-specific variable and is unaffected.
      BINDGEN_EXTRA_CLANG_ARGS: -include stdbool.h
    steps:
      - uses: actions/checkout@v5
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
      - run: bundle exec rake

  # The parser is a pinned pre-1.0 engine, so an upgrade has to be checked
  # against far more content than the suite vendors.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: test/fetch_corpus.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bundle exec rake test:corpus

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cargo-cache: true
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
